name: Refresh profile visuals

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hiteshx2026
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hiteshx2026
          outputs: |
            assets/github-snake.svg?color_snake=0ea5e9
            assets/github-snake-dark.svg?palette=github-dark&color_snake=00e5ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ assets/github-snake*.svg
          if git diff --staged --quiet; then
            echo "Visuals are already current."
          else
            git commit -m "Refresh contribution skyline and snake"
            git push
          fi
